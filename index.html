<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Clock</title>
</head>
<body>
    <div id="box1">
        <h1 id="title1">Clock</h1>
        <h2 id="time">00:00:00</h2>
        <h2 id="date"></h2>
    </div>
    <div id="box2">
      <h1 id="title2">Stopwatch</h1>
      <h2 id="time2">00:00:00</h2>
      <button onclick="startStopwatch()" >Start</button>
      <button onclick="stopStopwatch()" >Stop</button>
      <button onclick="resetStopwatch()" >Reset</button>
    </div>
    <div id="box3">
        <h1 id="title3">Timer</h1>
        <h2 id="time3">00:00:00</h2>
        <input type="number" id="timeip" placeholder="enter the time here">
        <button onclick="Timer()">Start</button>
    </div>
    <div id="box4">
        <h1 id="title4">Alarm</h1>
        <h2 id="time4">00:00:00</h2>
        <input type="time" title="Inputtime" id="alarmip" placeholder="setalarm">
        <button onclick="Alarmstart()">Start</button>
    </div>

    <script src="clock.js"></script>
</body>
</html>
